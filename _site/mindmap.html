              }
            })(() => window.markmap,null,{"content":"Epidemic intelligence: personal TOC","children":[{"content":"1 &#xb7; Quantitative risk assessment: jointly assessing hazard and vulnerability","children":[{"content":"Value of data: routine v responsive surveillance","children":[{"content":"UK routine surveillance data: audit bias &amp; delays","children":[{"content":"<strong>Background:</strong> Real-time surveillance is the first line of defence; key biases (reporting delay, under-ascertainment, selection) are not documented systematically. What are the main biases in UK routine surveillance data relevant to outbreak response?","children":[],"payload":{"tag":"li","lines":"15,16"}},{"content":"<strong>Approach:</strong> Audit routine UK surveillance data; structured review against Epinowcast reporting delay methodology; co-production with UKHSA analysts","children":[],"payload":{"tag":"li","lines":"16,17"}},{"content":"<strong>Outcomes:</strong> Directly useful to LA and UKHSA analysts; complement to Epinowcast Guide to STLT Reporting Delays","children":[{"content":"<strong>Outputs:</strong> Practical guide to UK surveillance biases; recommended workflow for real-time analysts","children":[],"payload":{"tag":"li","lines":"18,20"}}],"payload":{"tag":"li","lines":"17,20"}}],"payload":{"tag":"h4","lines":"13,14"}},{"content":"Triangulating among data sources for jointly assessing hazard and vulnerability","children":[{"content":"<strong>Background:</strong>  COVID-19 produced data across the full infection pathway, including major investment in novel data streams (eg ONS-CIS, CoMix). No systematic framework for comparing these to existing data sources in terms of population representativeness, or integrating these in order to estimate hazard and vulnerability jointly. What is the cost per unit of accuracy for each surveillance stream, and which streams should be prioritised in a future outbreak?","children":[{"content":"<strong>RQ:</strong> How should risk assessment triangulate between multiple data sources to capture both likelihood and impact?","children":[],"payload":{"tag":"li","lines":"22,23"}}],"payload":{"tag":"li","lines":"21,23"}},{"content":"<strong>Approach:</strong> Identify relative representativeness of major Covid-19 data sources for representing likelihood/hazard/exposure (eg wastewater, CoMix, ONS-CIS), vs impact/vulnerability (eg case notifications, hospitalisations, deaths, overall excess deaths)","children":[],"payload":{"tag":"li","lines":"23,24"}},{"content":"<strong>Outcomes:</strong> A structured approach to jointly assessing hazard and vulnerability components of risk","children":[{"content":"<strong>Outputs:</strong> Triangulation framework applicable to future outbreaks","children":[],"payload":{"tag":"li","lines":"25,27"}}],"payload":{"tag":"li","lines":"24,27"}}],"payload":{"tag":"h4","lines":"20,21"}},{"content":"Latent quantities: evaluating ONS excess deaths vs SPI-M R estimates","children":[{"content":"<strong>Background:</strong> Both R (SPI-M) and excess deaths (ONS) are latent, time-lagged, censored estimates.","children":[{"content":"<strong>RQ:</strong> How do demand-driven (SPI-M) and supply-driven (ONS) production modes compare against TQV criteria &#x2014; uncertainty communication, QA mechanisms, responsibility allocation?","children":[],"payload":{"tag":"li","lines":"29,30"}}],"payload":{"tag":"li","lines":"28,30"}},{"content":"<strong>Approach:</strong> Compare accuracy of real-time estimates vs &apos;gold standard&apos;; uncertainty language, QA processes, accountability structures; documentary analysis + OSR compliance review","children":[],"payload":{"tag":"li","lines":"30,31"}},{"content":"<strong>Outcomes:</strong> Which elements of each mode should be carried forward into future epidemic intelligence infrastructure","children":[{"content":"<strong>Outputs:</strong> Comparative case study of two production modes; institutional design recommendations","children":[],"payload":{"tag":"li","lines":"32,35"}}],"payload":{"tag":"li","lines":"31,35"}}],"payload":{"tag":"h4","lines":"27,28"}}],"payload":{"tag":"h3","lines":"11,12"}},{"content":"Value of expertise: the SPI-M consensus model","children":[{"content":"Expert elicitation: SPI-M vs validated protocols (IDEA/SHELF/DELPHI)","children":[{"content":"<strong>Background:</strong> SPI-M convenes group discussion to produce consensus estimates; no systematic comparison to expert elicitation standards. Where does SPI-M practice conform to or deviate from SHELF/DELPHI protocols, and which deviations are associated with poorer calibration?","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"<strong>Approach:</strong> Documentary analysis of SPI-M process; structured comparison against SHELF and DELPHI criteria; link deviations to calibration outcomes from A1","children":[],"payload":{"tag":"li","lines":"39,40"}},{"content":"<strong>Outcomes:</strong> Adoption of structured protocol for SPI-M","children":[{"content":"<strong>Outputs:</strong> Assessment of SPI-M elicitation quality; recommendations for structural improvements","children":[],"payload":{"tag":"li","lines":"41,43"}}],"payload":{"tag":"li","lines":"40,43"}}],"payload":{"tag":"h4","lines":"37,38"}},{"content":"SPI-M R/r calibration","children":[{"content":"<strong>Background:</strong> SPI-M consensus estimates of R/growth rate were central to UK COVID-19 policy; no external calibration has been published. Statements use qualitative uncertainty language and a consensus (mean) quantitative ranne. How were these estimates calibrated, and what factors (variant phase, number of models, data sources) drove error? Is the language of uncertainty in SPI-M statements calibrated to the quantitative evidence available at the time, retrospectively, and against the standardised PH uncertainty language?","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"<strong>Approach:</strong> Proper scoring rules (calibration, sharpness); specificity/sensitivity/PPV. Text mining all consensus statements; code probabilistic language against GRADE framework; match to quantitative outputs at same timepoint","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"<strong>Outcomes:</strong> Whether overconfidence was systematic; lessons for future consensus design","children":[{"content":"<strong>Outputs:</strong> First systematic external evaluation of a national epidemic advisory consensus; performance characterisation by stratified factors; reporting guidelines for consensus statement language; empirical audit of language-quantity consistency","children":[],"payload":{"tag":"li","lines":"47,49"}}],"payload":{"tag":"li","lines":"46,49"}}],"payload":{"tag":"h4","lines":"43,44"}},{"content":"Model genealogy: error across SPI-M models","children":[{"content":"<strong>Background:</strong> Unknown methodological overlap/conflict among models contributed to SPI-M; unclear which are genuinely independent. Which models capture redundant vs complementary signals, and how does this map to error structure?","children":[],"payload":{"tag":"li","lines":"50,51"}},{"content":"<strong>Approach:</strong> create DAG for each model to assess comparable/conflicting assumptions between models; evaluate bias/variance in error across models and over time","children":[],"payload":{"tag":"li","lines":"51,52"}},{"content":"<strong>Outcomes:</strong> Taxonomy of error; diversity of methods vs number","children":[],"payload":{"tag":"li","lines":"52,54"}}],"payload":{"tag":"h4","lines":"49,50"}}],"payload":{"tag":"h3","lines":"35,36"}}],"payload":{"tag":"h2","lines":"9,10"}},{"content":"2 &#xb7; Evidence-informed risk governance","children":[{"content":"Operationalising &quot;situational awareness&quot;: who needs what and when?","children":[{"content":"<strong>Background:</strong> &quot;Situational awareness&quot; is cited as the goal of epidemic intelligence but rarely operationalised in terms of specific users, decisions, or information resolutions. What specific information do decision-makers at different levels need, at what temporal and spatial resolution, to make outbreak response decisions?","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"<strong>Approach:</strong> Analyse sitreps (WHO Disease Outbreak News, RST, CDC; PHE); interview public health decision-makers; map information needs against data availability","children":[],"payload":{"tag":"li","lines":"60,61"}},{"content":"<strong>Outcomes:</strong> Gap between available intelligence and actual decision needs; basis for demand-side design of intelligence systems","children":[{"content":"<strong>Outputs:</strong> Operational definition of situational awareness by decision context; design guide for epidemic intelligence systems","children":[],"payload":{"tag":"li","lines":"62,64"}}],"payload":{"tag":"li","lines":"61,64"}}],"payload":{"tag":"h4","lines":"58,59"}},{"content":"What is SPI-M&apos;s responsibility for risk assessment?","children":[{"content":"<strong>Background:</strong> UK Government defines a &quot;three lines of defense&quot; (operational, internal review, independent) risk framework. SPI-M&apos;s function shifted between all three during COVID; while improvised advisory structures created accountability gaps, with few standards for expert recruitment, task allocation, QA, or emergency-routine transition.","children":[{"content":"<strong>Stakeholders:</strong> Cabinet Office, SPI-M","children":[],"payload":{"tag":"li","lines":"66,67"}}],"payload":{"tag":"li","lines":"65,67"}},{"content":"<strong>Approach:</strong> Documentary analysis against Orange Book framework; participant interviews; comparative risk reporting standards analysis","children":[{"content":"<strong>Skills/resources:</strong> Risk governance frameworks, documentary analysis; Orange Book / HMT materials publicly available","children":[],"payload":{"tag":"li","lines":"68,69"}}],"payload":{"tag":"li","lines":"67,69"}},{"content":"<strong>Outputs:</strong> Framework paper mapping advisory modelling to government risk governance; role clarification recommendations","children":[{"content":"<strong>Outcomes:</strong> Explicit role definition would have reduced both over-reliance and under-use of SPI-M among the dimensions of risk (likelihood/hazard, impact/vulnerability)","children":[],"payload":{"tag":"li","lines":"70,72"}}],"payload":{"tag":"li","lines":"69,72"}}],"payload":{"tag":"h4","lines":"64,65"}}],"payload":{"tag":"h2","lines":"56,57"}},{"content":"3 &#xb7; Better integratation of routine and response mode","children":[{"content":"Research workforce","children":[{"content":"Career survival analysis of UK outbreak responders","children":[{"content":"<strong>Background:</strong> COVID-19 created specific career pressures (burnout, contract instability, first-mover advantage effects); no empirical data on career outcomes for academic outbreak responders. Early work accumulates disproportionate reputation (citations) plausibly at the expense of quality (rapid vs quality assured). This may distort advisory group composition in future outbreaks. What is the career trajectory of academic outbreak responders, and what institutional factors predict retention in the field?","children":[{"content":"<strong>Stakeholders:</strong> NIHR, Wellcome, UKHSA, research funders, research institution strategy, advisory recruitment","children":[],"payload":{"tag":"li","lines":"80,81"}}],"payload":{"tag":"li","lines":"79,81"}},{"content":"<strong>Approach:</strong> Retrospective cohort, established via outbreak response literature, citation networks + ORCID; time-to-event outcomes (institution change, mental health diagnosis, field exit); survival analysis stratified by career stage, contract type, funding source","children":[],"payload":{"tag":"li","lines":"81,82"}},{"content":"<strong>Outcomes:</strong> Whether and how academic career structures systematically advantage / disadvantage outbreak responders; whether advisory body recruitment should actively counteract seniority bias","children":[{"content":"<strong>Outputs:</strong> Empirical characterisation of outbreak responder attrition; evidence base for institutional support policies","children":[],"payload":{"tag":"li","lines":"83,85"}}],"payload":{"tag":"li","lines":"82,85"}}],"payload":{"tag":"h4","lines":"78,79"}},{"content":"Institutional SOP for redeploying researchers to emergencies","children":[{"content":"<strong>Background:</strong> LSHTM and similar institutions lack formal protocols for rapid deployment of research expertise to outbreak response. What SOP structure would enable effective, equitable, and sustainable academic redeployment for outbreak emergencies?","children":[{"content":"<strong>Stakeholders:</strong> Research institution senior management, Wellcome, NIHR, university research offices","children":[],"payload":{"tag":"li","lines":"87,88"}}],"payload":{"tag":"li","lines":"86,88"}},{"content":"<strong>Approach:</strong> Case study of LSHTM &amp; Imperial COVID-19 and Ex Pegasus response; comparative analysis of 3-4 institutions; co-production with senior management","children":[],"payload":{"tag":"li","lines":"88,89"}},{"content":"<strong>Outcomes:</strong> Moving from informal first-mover networks to explicit institutional capacity","children":[{"content":"<strong>Outputs:</strong> Draft institutional SOP for research redeployment; publishable case study","children":[],"payload":{"tag":"li","lines":"90,92"}}],"payload":{"tag":"li","lines":"89,92"}}],"payload":{"tag":"h4","lines":"85,86"}},{"content":"Embedding evaluation and ethics in modeller training","children":[{"content":"<strong>Background:</strong> Modellers trained primarily in technical methods; evaluation, responsibility, and ethics rarely addressed in formal training. What evaluation and ethics curriculum is appropriate for real-time epidemic modellers at postgraduate and professional level?","children":[{"content":"<strong>Stakeholders:</strong> GSID, ESPIDAM, SISMID, epiverse, LSHTM, training providers","children":[],"payload":{"tag":"li","lines":"94,95"}}],"payload":{"tag":"li","lines":"93,95"}},{"content":"<strong>Approach:</strong> Curriculum gap analysis; community consultation (Delphi or workshop)","children":[{"content":"<strong>Skills/resources:</strong> Education research, curriculum design; international training network","children":[],"payload":{"tag":"li","lines":"96,97"}}],"payload":{"tag":"li","lines":"95,97"}},{"content":"<strong>Outcomes:</strong> Professionalisation of modelling as a discipline with explicit standards and responsibilities","children":[{"content":"<strong>Outputs:</strong> Training resources; workshop materials; possible new short course module","children":[],"payload":{"tag":"li","lines":"98,100"}}],"payload":{"tag":"li","lines":"97,100"}}],"payload":{"tag":"h4","lines":"92,93"}}],"payload":{"tag":"h3","lines":"76,77"}},{"content":"Operational workforce","children":[{"content":"What is the current capability, opportunity, and motivation for real-time outbreak analysis among UK public health intelligence teams?","children":[{"content":"<strong>Background:</strong> UK public health devolution means much routine outbreak analysis is now at LA level; no systematic assessment of current methods, tools, or workforce capacity","children":[{"content":"<strong>Stakeholders:</strong> UKHSA, LA public health directors, NIHR ARCs, NHS England","children":[],"payload":{"tag":"li","lines":"104,105"}}],"payload":{"tag":"li","lines":"103,105"}},{"content":"<strong>Approach:</strong> COM-B framework; structured survey of LA PH intelligence teams; pilot with UKHSA sample; compare with NHS England workforce data","children":[{"content":"<strong>Skills/resources:</strong> Survey design, COM-B framework, public health systems knowledge; LA network via NIHR ARC or HPRU","children":[],"payload":{"tag":"li","lines":"106,107"}}],"payload":{"tag":"li","lines":"105,107"}},{"content":"<strong>Outcomes:</strong> Where the gap between available methods and actual practice is greatest; what interventions are feasible","children":[{"content":"<strong>Outputs:</strong> Baseline assessment of LA PH intelligence capacity; evidence for targeted training and tool development","children":[],"payload":{"tag":"li","lines":"108,110"}}],"payload":{"tag":"li","lines":"107,110"}}],"payload":{"tag":"h4","lines":"102,103"}},{"content":"What influences public health practitioners&apos; use of forecasts?","children":[{"content":"<strong>Background:</strong> Forecast design driven by methodological rather than user preferences; unknown what attributes practitioners actually value in practice (eg performance, interpretability, context-specificity, source trust)","children":[],"payload":{"tag":"li","lines":"111,112"}},{"content":"<strong>Approach:</strong> Pilot qualitative study of decision contexts; discrete choice experiment instrument design; e.g. willingness-to-pay analysis for additional model / increase in accuracy / calibration","children":[{"content":"<strong>Skills/resources:</strong> DCE design, survey methods, health economics","children":[],"payload":{"tag":"li","lines":"113,114"}}],"payload":{"tag":"li","lines":"112,114"}},{"content":"<strong>Outcomes:</strong> What practitioners actually want vs what modellers typically provide","children":[{"content":"<strong>Outputs:</strong> Evidence on user preferences for forecast design; basis for commissioning decisions; published discrete choice experiement instrument and pilot","children":[],"payload":{"tag":"li","lines":"115,117"}}],"payload":{"tag":"li","lines":"114,117"}}],"payload":{"tag":"h4","lines":"110,111"}},{"content":"Where is local-level forecasting in use, and could better methods improve forecast quality?","children":[{"content":"<strong>Background:</strong> NHS trusts and LAs have no systematic access to locally tailored respiratory forecasts; current practice is ad hoc and unevaluated","children":[{"content":"<strong>Stakeholders:</strong> NIHR HPRU, Joe Hilton, UKHSA, LA public health, NHS trust PHNs","children":[],"payload":{"tag":"li","lines":"119,120"}}],"payload":{"tag":"li","lines":"118,120"}},{"content":"<strong>Approach:</strong> Stakeholder mapping; pilot in 1-2 sites (e.g. UKHSA + Southwark/Camden + NHS trust); before/after comparison; process evaluation","children":[{"content":"<strong>Skills/resources:</strong> Implementation science, forecasting, co-production; NIHR HPRU as vehicle; Joe Hilton, UKHSA/LA links","children":[],"payload":{"tag":"li","lines":"121,122"}}],"payload":{"tag":"li","lines":"120,122"}},{"content":"<strong>Outcomes:</strong> Applied test of whether structured production improves both quality and use","children":[{"content":"<strong>Outputs:</strong> Pilot forecasting system; evaluation report; implementation guidance for wider adoption","children":[],"payload":{"tag":"li","lines":"123,125"}}],"payload":{"tag":"li","lines":"122,125"}}],"payload":{"tag":"h4","lines":"117,118"}},{"content":"LSHTM Epidemiology of Infectious Diseases module redesign","children":[{"content":"<strong>Background:</strong> LSHTM MSc module a globally recognised training ground for outbreak responders. In need of modernisation; no curriculum review undertaken recently","children":[{"content":"<strong>Stakeholders:</strong> LSHTM Masters programme, students, public health employers, epi teaching programmes eg ESPIDAM/SISMID","children":[],"payload":{"tag":"li","lines":"127,128"}}],"payload":{"tag":"li","lines":"126,128"}},{"content":"<strong>Approach:</strong> Curriculum audit; competitor course review; student/employer needs assessment","children":[],"payload":{"tag":"li","lines":"128,129"}},{"content":"<strong>Outcomes:</strong> Strengthens LSHTM&apos;s position in ID training; embeds evaluation and real-time methods at postgraduate level","children":[],"payload":{"tag":"li","lines":"129,130"}},{"content":"","children":[],"payload":{"tag":"li","lines":"130,131"}}],"payload":{"tag":"h4","lines":"125,126"}}],"payload":{"tag":"h3","lines":"100,101"}}],"payload":{"tag":"h2","lines":"74,75"}},{"content":"Other","children":[{"content":"Intellectual itches","children":[{"content":"WTF SPI-M","children":[{"content":"<strong>Background:</strong> The pattern of outbreak responses (FMD, H1N1, Ebola, COVID) reflects accumulated institutional choices; the extent to which lessons were actually learned between outbreaks is unknown. The rationale and development of  SPI-M as a poweful advisory body, from FMD (2001) to now, is undocumented. Contingent historical structures and processes shaped an (arbitrary) advisory system, now being exported internationally and uncritically. For what, and for whom, does SPI-M work?","children":[{"content":"<strong>Stakeholders:</strong> SPI-M participants (all eras), Cabinet Office, international adopters of the &quot;SPI-M model&quot;","children":[],"payload":{"tag":"li","lines":"137,138"}}],"payload":{"tag":"li","lines":"136,138"}},{"content":"<strong>Approach:</strong> Documentary analysis (Inquiries, Hansard, FOI); interview programme with participants across multiple outbreak periods; bibliometric tracing of SPI-M participants and outputs; quantitative eval of outbreak estimates","children":[],"payload":{"tag":"li","lines":"138,139"}},{"content":"<strong>Outcomes:</strong> Whether SPI-M &apos;works&apos;, and whether lessons from SPI-M are transferable or context-specific; clarity about advisory function (independent analysis vs peer review vs technical support)","children":[{"content":"<strong>Outputs:</strong> Long-form historical account","children":[],"payload":{"tag":"li","lines":"140,142"}}],"payload":{"tag":"li","lines":"139,142"}}],"payload":{"tag":"h4","lines":"135,136"}},{"content":"&quot;Role models&quot;","children":[{"content":"Personal theory that each academic modelling field has a canonical theoretical model, against which model development is (implicitly) evaluated: a &quot;role model&quot;.","children":[],"payload":{"tag":"li","lines":"143,144"}},{"content":"In ID epidemiology it is the SIR (the first port of call for explanatory modelling; the baseline expectation). In climate modelling, it&apos;s the energy balance; in economics it&apos;s [? supply/demand equilibrium].","children":[],"payload":{"tag":"li","lines":"144,145"}},{"content":"These role models gives the field a baseline for evaluation. By contrast, e.g. general clinical prediction does not have such mechanistic role models, and evaluation is at a loss. With LLMs, modelling is in an &quot;existential crisis&quot; due to proliferation without a clear theoretical hierarchy.","children":[],"payload":{"tag":"li","lines":"145,149"}}],"payload":{"tag":"h4","lines":"142,143"}}],"payload":{"tag":"h3","lines":"133,134"}},{"content":"Forecast evaluation methods","children":[{"content":"EpiNow2 retrospective self-evaluation","children":[{"content":"<strong>Background:</strong> EpiNow2 used globally for COVID-19 R estimation; no documented evaluation of its accuracy. How accurate were EpiNow2 forecasts across COVID-19, and how did model development cycles affect accuracy?","children":[],"payload":{"tag":"li","lines":"152,153"}},{"content":"<strong>Approach:</strong> Retrospective proper scoring vs data; code commit history as proxy for development; citation/usage tracing across academic and grey literature","children":[],"payload":{"tag":"li","lines":"153,154"}},{"content":"<strong>Outcomes:</strong> Model development cycles and their measurable impact on accuracy; case for continuous software evaluation","children":[{"content":"<strong>Outputs:</strong> Self-evaluation paper","children":[],"payload":{"tag":"li","lines":"155,157"}}],"payload":{"tag":"li","lines":"154,157"}}],"payload":{"tag":"h4","lines":"151,152"}},{"content":"Encompassing test for model identifiability","children":[{"content":"<strong>Background:</strong> When models have similar performance, no standard method exists for testing whether one model encompasses/explains the other in an epidemic context. Can the HLN encompassing test be adapted for epidemic model comparison to distinguish genuinely independent from redundant model pairs?","children":[],"payload":{"tag":"li","lines":"158,159"}},{"content":"<strong>Approach:</strong> Methodological adaptation of HLN test; simulation study; application to SPI-M model submission archive","children":[],"payload":{"tag":"li","lines":"159,160"}},{"content":"<strong>Outcomes:</strong> When model diversity is genuinely informative vs when it is illusory","children":[],"payload":{"tag":"li","lines":"160,162"}}],"payload":{"tag":"h4","lines":"157,158"}},{"content":"Standardised reporting guidelines for forecast evaluation (PRISMA equivalent)","children":[{"content":"<strong>Background:</strong> No consensus on what constitutes rigorous evaluation in epidemic forecasting; commissioning decisions made by intuition. What minimum reporting standard should apply to epidemic forecast evaluation?","children":[],"payload":{"tag":"li","lines":"163,164"}},{"content":"<strong>Approach:</strong> Formal Delphi with forecasting practitioners and evaluation experts; iterative consensus","children":[],"payload":{"tag":"li","lines":"164,165"}},{"content":"<strong>Outcomes:</strong> Establishes forecast evaluation as a recognised methodological domain","children":[{"content":"<strong>Outputs:</strong> PRISMA-equivalent reporting guidelines; professional standard for the field","children":[],"payload":{"tag":"li","lines":"166,167"}}],"payload":{"tag":"li","lines":"165,167"}}],"payload":{"tag":"h4","lines":"162,163"}}],"payload":{"tag":"h3","lines":"149,150"}}],"payload":{"tag":"h2","lines":"131,132"}}],"payload":{"tag":"h1","lines":"7,8"}},{"colorFreezeLevel":2,"maxWidth":500,"initialExpandLevel":3})</script>
